<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>截止提醒</title>
    <style>
      /* 与主界面同一套 token（方案 C：深蓝紫玻璃 + 青绿点缀）。
         窗口是透明的，Windows 上 backdrop-filter 虚化不到桌面，所以卡片底色画到接近不透明 */
      :root {
        color-scheme: light;

        --surf-a: #fbfdff;
        --surf-b: #e7eef9;
        --glow-teal: radial-gradient(120% 70% at 88% 106%, rgba(20, 179, 148, 0.2) 0%, rgba(20, 179, 148, 0) 66%);
        --glow-blue: radial-gradient(110% 80% at 10% -8%, rgba(150, 190, 255, 0.4) 0%, rgba(150, 190, 255, 0) 62%);
        --spec: radial-gradient(120% 90% at 12% 0%, rgba(255, 255, 255, 0.95) 0%, rgba(255, 255, 255, 0) 62%);

        --card-line: rgba(15, 28, 51, 0.11);
        --edge: inset 0 0 0 1px rgba(255, 255, 255, 0.85), inset 0 1px 0 rgba(255, 255, 255, 0.95);

        --txt: #0f1c33;
        --txt2: #2b3d5c;
        --txt3: #5b6f8f;
        --txt4: #8496b3;
        --line: rgba(15, 28, 51, 0.09);

        --teal-a: #23c39f;
        --teal-b: #0f9e83;
        --teal-ink: #ffffff;
        --teal-glow: rgba(15, 158, 131, 0.26);

        --tile: rgba(255, 255, 255, 0.72);
        --tile-line: rgba(15, 28, 51, 0.08);
        --hover: rgba(15, 28, 51, 0.055);
        --hover-line: rgba(15, 28, 51, 0.16);
        --scroll: rgba(120, 150, 190, 0.45);

        --warn: #9a5a10;
        --warn-bg: rgba(214, 140, 50, 0.16);
        --danger: #c22b45;
        --danger-bg: rgba(214, 60, 90, 0.11);
      }

      body.dark {
        color-scheme: dark;

        --surf-a: #172450;
        --surf-b: #080e22;
        --glow-teal: radial-gradient(120% 70% at 88% 106%, rgba(95, 227, 192, 0.22) 0%, rgba(95, 227, 192, 0) 66%);
        --glow-blue: radial-gradient(110% 80% at 10% -8%, rgba(70, 105, 190, 0.5) 0%, rgba(70, 105, 190, 0) 62%);
        --spec: radial-gradient(120% 90% at 12% 0%, rgba(255, 255, 255, 0.16) 0%, rgba(255, 255, 255, 0) 62%);

        --card-line: rgba(255, 255, 255, 0.14);
        --edge: inset 0 0 0 1px rgba(255, 255, 255, 0.11), inset 0 1px 0 rgba(255, 255, 255, 0.22);

        --txt: #f1f5ff;
        --txt2: #c3d2f0;
        --txt3: #8b9dc6;
        --txt4: #6f81a8;
        --line: rgba(255, 255, 255, 0.09);

        --teal-a: #8ff0da;
        --teal-b: #5fe3c0;
        --teal-ink: #04231d;
        --teal-glow: rgba(95, 227, 192, 0.34);

        --tile: rgba(255, 255, 255, 0.07);
        --tile-line: rgba(255, 255, 255, 0.11);
        --hover: rgba(255, 255, 255, 0.09);
        --hover-line: rgba(255, 255, 255, 0.22);
        --scroll: rgba(255, 255, 255, 0.22);

        --warn: #ffd7a3;
        --warn-bg: rgba(255, 170, 80, 0.15);
        --danger: #ff8f8f;
        --danger-bg: rgba(255, 80, 100, 0.16);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif;
        user-select: none;
      }

      /* 窗口只在卡片四周留了 8px，装不下任何外扩投影：画了也会被窗口边裁成一圈硬边，
         看着像多了一层半透明边框。所以卡片铺满窗口，立体感只靠描边和内高光 */
      body {
        padding: 0;
      }

      .card {
        width: 100%;
        height: 100%;
        padding: 15px 17px 16px;
        display: grid;
        grid-template-rows: auto 1fr auto;
        gap: 11px;
        background: var(--glow-blue), var(--glow-teal), var(--spec), linear-gradient(180deg, var(--surf-a) 0%, var(--surf-b) 100%);
        border: 1px solid var(--card-line);
        border-radius: 21px;
        box-shadow: var(--edge);
        color: var(--txt);
      }

      .head {
        display: flex;
        align-items: center;
        gap: 9px;
        -webkit-app-region: drag;
      }

      .head .ico {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 27px;
        height: 27px;
        border-radius: 10px;
        flex: 0 0 auto;
        background: var(--warn-bg);
        color: var(--warn);
        box-shadow: inset 0 0 0 1px rgba(155, 110, 40, 0.18);
      }

      /* 已经逾期的那一档换成危险的玫红，光看图标就知道严重程度 */
      .card.is-over .head .ico {
        background: var(--danger-bg);
        color: var(--danger);
        box-shadow: inset 0 0 0 1px rgba(200, 60, 90, 0.2);
      }

      .head h1 {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.2px;
        color: var(--txt);
      }

      .head .x {
        -webkit-app-region: no-drag;
        margin-left: auto;
        width: 25px;
        height: 25px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 0;
        border-radius: 9px;
        background: transparent;
        color: var(--txt4);
        cursor: pointer;
        transition: background 0.16s, color 0.16s;
      }

      .head .x:hover {
        background: var(--hover);
        color: var(--txt);
      }

      .body {
        display: grid;
        gap: 7px;
        align-content: start;
        min-height: 0;
        overflow: hidden;
      }

      .line {
        display: flex;
        gap: 6px;
        font-size: 13px;
      }

      .line .k {
        color: var(--txt3);
        flex: 0 0 auto;
      }

      .line .v {
        color: var(--txt2);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .line.name .v {
        font-size: 15px;
        font-weight: 600;
        color: var(--txt);
      }

      .stat {
        font-size: 12px;
        color: var(--txt4);
      }

      .list {
        display: grid;
        gap: 8px;
        overflow-y: auto;
        min-height: 0;
        margin-right: -6px;
        padding-right: 6px;
      }

      .list::-webkit-scrollbar {
        width: 6px;
      }

      .list::-webkit-scrollbar-thumb {
        background: var(--scroll);
        border-radius: 3px;
      }

      .row {
        display: grid;
        gap: 3px;
        padding: 8px 11px;
        border-radius: 14px;
        background: var(--tile);
        border: 1px solid var(--tile-line);
      }

      .row .n {
        font-size: 13px;
        font-weight: 600;
        color: var(--txt);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .row .m {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        font-size: 11px;
        color: var(--txt4);
      }

      .row .m .s {
        flex: 0 0 auto;
        color: var(--warn);
      }

      .row.od .m .s {
        color: var(--danger);
      }

      .foot {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .more {
        flex: 1 1 auto;
        text-align: center;
        font-size: 11px;
        color: var(--txt4);
      }

      /* 只有一条提醒时「还有 N 项」是空的，靠它撑开会把「稍后」甩到中间，所以自己顶到最右 */
      .later {
        margin-left: auto;
      }

      .btn {
        min-width: 76px;
        padding: 8px 17px;
        border-radius: 999px;
        font-size: 13px;
        font-family: inherit;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.16s, border-color 0.16s, color 0.16s, box-shadow 0.16s;
      }

      .later {
        border: 1px solid var(--line);
        background: transparent;
        color: var(--txt3);
        font-weight: 500;
      }

      .later:hover {
        border-color: var(--hover-line);
        background: var(--hover);
        color: var(--txt);
      }

      .ok {
        border: 0;
        background: linear-gradient(180deg, var(--teal-a), var(--teal-b));
        color: var(--teal-ink);
        box-shadow: 0 5px 14px var(--teal-glow);
      }

      .ok:hover {
        filter: brightness(1.05);
        box-shadow: 0 7px 18px var(--teal-glow);
      }

      .ok:active {
        filter: brightness(0.96);
      }

      @media (prefers-reduced-motion: reduce) {
        .btn,
        .head .x {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="card" id="card">
      <div class="head">
        <span class="ico">
          <svg viewBox="0 0 20 20" width="18" height="18">
            <path d="M10 2.4 18.2 17H1.8L10 2.4Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
            <path d="M10 7.6v3.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
            <circle cx="10" cy="13.6" r="0.95" fill="currentColor" />
          </svg>
        </span>
        <h1 id="h">待办任务已截止</h1>
        <button class="x" id="x" title="稍后" aria-label="稍后">
          <svg viewBox="0 0 12 12" width="12" height="12">
            <path d="M3 3l6 6M9 3l-6 6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" />
          </svg>
        </button>
      </div>
      <div class="body" id="body">
        <div class="line"><span class="k">截止时间：</span><span class="v" id="due"></span><span class="k" id="note"></span></div>
        <div class="line name"><span class="k">任务名称：</span><span class="v" id="name"></span></div>
      </div>
      <div class="foot">
        <button class="btn ok" id="ok">确定</button>
        <span class="more" id="more"></span>
        <button class="btn later" id="later">稍后</button>
      </div>
    </div>
    <script src="remind.js"></script>
  </body>
</html>
