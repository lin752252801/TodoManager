<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>内存悬浮球</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: 'Microsoft YaHei UI', 'Segoe UI', system-ui, sans-serif;
        user-select: none;
      }

      .wrap {
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
      }

      .ball {
        position: relative;
        width: 56px;
        height: 56px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        cursor: pointer;
        /* 液态玻璃：透明窗口下没有可虚化的背景，用高光层 + 青绿透光辉 + 内描边把「玻璃球」画出来
           配色跟主界面同一套（青绿 → 靛蓝 → 深蓝紫）
           注意 background 的层序是「先写的盖在上面」：底色渐变必须放第一个，否则会把透光辉整个盖掉 */
        background:
          linear-gradient(152deg, rgba(35, 198, 165, 0.95) 0%, rgba(38, 150, 196, 0.94) 38%, rgba(43, 78, 176, 0.95) 74%, rgba(26, 38, 104, 0.96) 100%),
          radial-gradient(78% 44% at 50% 112%, rgba(143, 240, 218, 0.62) 0%, rgba(143, 240, 218, 0) 74%),
          radial-gradient(140% 120% at 78% 98%, rgba(46, 200, 166, 0.5) 0%, rgba(46, 200, 166, 0) 54%),
          radial-gradient(120% 110% at 98% 70%, rgba(109, 92, 235, 0.44) 0%, rgba(109, 92, 235, 0) 56%),
          radial-gradient(120% 120% at 30% 14%, rgba(255, 255, 255, 0.3) 0%, rgba(255, 255, 255, 0.08) 24%, rgba(255, 255, 255, 0) 46%);
        /* 窗口和球体等大（56px），外投影会被窗口边裁成一圈正方形灰边，
           所以只留内描边和内高光，立体感靠球体自身的渐变撑 */
        box-shadow:
          inset 0 0 0 1px rgba(255, 255, 255, 0.26),
          inset 0 2px 1px rgba(255, 255, 255, 0.62),
          inset 0 -1px 2px rgba(255, 255, 255, 0.4),
          inset 0 -10px 16px rgba(255, 255, 255, 0.16),
          inset 0 -2px 6px rgba(8, 22, 54, 0.42);
        color: #fff;
        transition: transform 0.14s, box-shadow 0.16s;
      }

      .ball::after {
        content: '';
        position: absolute;
        z-index: 2;
        left: 13px;
        top: 10px;
        width: 17px;
        height: 10px;
        border-radius: 50%;
        background: radial-gradient(closest-side, rgba(255, 255, 255, 0.8), rgba(255, 255, 255, 0));
        filter: blur(1.2px);
        transform: rotate(-18deg);
        pointer-events: none;
      }

      /* 窗口和球体等大，放大会把圆边裁平，所以悬停只加光和提亮 */
      .ball:hover {
        box-shadow:
          inset 0 0 0 1px rgba(255, 255, 255, 0.38),
          inset 0 2px 1px rgba(255, 255, 255, 0.74),
          inset 0 -1px 2px rgba(255, 255, 255, 0.5),
          inset 0 -10px 16px rgba(255, 255, 255, 0.22),
          inset 0 -2px 6px rgba(8, 22, 54, 0.42);
      }

      .ball:active {
        transform: scale(0.96);
      }

      .pct {
        position: relative;
        z-index: 1;
        /* 带一位小数后最长是「100.0%」6 个字符，15px 会顶到球边，降到 13.5px */
        font-size: 13.5px;
        font-weight: 700;
        letter-spacing: 0;
        line-height: 1.1;
        text-shadow: 0 1px 3px rgba(4, 14, 40, 0.8);
      }

      /* 副标题只在清理完那 2.6 秒出现，平时留空让百分比稳稳居中 */
      .cap {
        position: absolute;
        z-index: 1;
        left: 0;
        right: 0;
        bottom: 9px;
        text-align: center;
        font-size: 9px;
        opacity: 0.92;
        letter-spacing: 1px;
        text-shadow: 0 1px 3px rgba(4, 14, 40, 0.8);
        pointer-events: none;
      }

      /* 转圈只在清理时出现，平时完全隐藏 */
      .ring {
        position: absolute;
        z-index: 1;
        inset: 3px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.22);
        border-top-color: #ffffff;
        opacity: 0;
        transition: opacity 0.15s;
      }

      .busy .ring {
        opacity: 1;
        animation: spin 0.85s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* 结果直接写在球面上：窗口只有球那么大，弹层会被裁掉 */
      .pct.done {
        font-size: 14px;
      }

      /* 系统开了「减少动画」就不转圈、不缩放，只显示静态圈 */
      @media (prefers-reduced-motion: reduce) {
        .ball,
        .ball:hover,
        .ball:active {
          transform: none;
          transition: box-shadow 0.16s;
        }

        .busy .ring {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="ball" id="ball">
        <span class="ring"></span>
        <span class="pct" id="pct">--</span>
        <span class="cap" id="cap"></span>
      </div>
    </div>
    <script src="ball.js"></script>
  </body>
</html>
